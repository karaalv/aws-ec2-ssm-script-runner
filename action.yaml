name: "Run S3 script on EC2 via SSM"
description: "Fetch a script from S3 and run via SSM"

inputs:
  instance-id:
    description: "EC2 instance id (optional)"
    required: false
    default: ""

  instance-name:
    description: "EC2 Name tag value (optional)"
    required: false
    default: ""

  bucket-name:
    description: "S3 bucket containing script"
    required: true

  script-location:
    description: "S3 key of the script"
    required: true

  env-vars-for-script:
    description: |
      Newline-separated KEY=VALUE pairs.
      Exported before running the script.
    required: false
    default: ""

  script-name:
    description: |
      Override local filename.
      Defaults to basename(script-location).
    required: false
    default: ""

  poll-interval-seconds:
    description: "Seconds between polling SSM"
    required: false
    default: "5"

  timeout-seconds:
    description: "Remote execution timeout and local monitoring limit in seconds (1-172800)"
    required: false
    default: "1800"

  cloudwatch-logs:
    description: "Stream CloudWatch output into the workflow log; requires additional IAM permissions"
    required: false
    default: "false"

  cloudwatch-log-group:
    description: "CloudWatch log group used for SSM output"
    required: false
    default: "/aws/ssm/AWS-RunShellScript"

  cloudwatch-drain-seconds:
    description: "Additional seconds to collect delayed CloudWatch events after completion (0-300)"
    required: false
    default: "35"

outputs:
  command-id:
    description: "SSM command id"
    value: ${{ steps.run.outputs.command-id }}

  status:
    description: "Final SSM status or local MonitoringFailed, TimedOut or Cancelled outcome"
    value: ${{ steps.run.outputs.status }}

  exit-code:
    description: "SSM response code"
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    - name: Run script via SSM
      id: run
      shell: bash
      run: |
        set -euo pipefail
        bash "${{ github.action_path }}/scripts/run.sh"
      env:
        INPUT_INSTANCE_ID: ${{ inputs.instance-id }}
        INPUT_INSTANCE_NAME: ${{ inputs.instance-name }}
        INPUT_BUCKET_NAME: ${{ inputs.bucket-name }}
        INPUT_SCRIPT_LOCATION: ${{ inputs.script-location }}
        INPUT_ENV_VARS: ${{ inputs.env-vars-for-script }}
        INPUT_SCRIPT_NAME: ${{ inputs.script-name }}
        INPUT_POLL_INTERVAL: ${{ inputs.poll-interval-seconds }}
        INPUT_TIMEOUT: ${{ inputs.timeout-seconds }}
        INPUT_CLOUDWATCH_LOGS: ${{ inputs.cloudwatch-logs }}
        INPUT_CLOUDWATCH_LOG_GROUP: ${{ inputs.cloudwatch-log-group }}
        INPUT_CLOUDWATCH_DRAIN: ${{ inputs.cloudwatch-drain-seconds }}
